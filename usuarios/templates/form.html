<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            padding: 6px;
            width: 250px;
        }

        button {
            padding: 8px 16px;
            background-color: #0096c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .erro {
            color: red;
            font-size: 0.9em;
        }

        a {
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>
    <h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Usuário</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            <form method="post" enctype="multipart/form-data"></form>
            {{ field }}
            {% if field.errors %}
            <div class="erro">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit">Salvar</button>
    </form>

    <p><a href="{% url 'listar_usuarios' %}">&larr; Voltar para a lista</a></p>
</body>

</html>
