{% extends "base.html" %}

{% block content %}
<div class="pagina-centralizada">

<h1>Confirmar exclusão</h1>

<div class="card" style="max-width: 420px; margin: 0 auto;">
    <p style="color: var(--text-soft); margin-top: 0;">
        Tem certeza que deseja excluir <strong style="color: var(--text);">{{ usuario.nome }}</strong>? Essa ação não
        pode ser desfeita.
    </p>
    <form method="post">
        {% csrf_token %}
        <div style="display:flex; gap: 10px;">
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'listar_usuarios' %}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
