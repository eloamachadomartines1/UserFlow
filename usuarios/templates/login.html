<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 6px;
            width: 250px;
        }

        button {
            padding: 8px 16px;
            background-color: #0096c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .erro {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Login</h1>

    {% if form.errors %}
     <p class="erro">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Usuário</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Senha</label>
            {{ form.password }}
        </div>
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{% url 'listar_usuarios' %}">&larr; Voltar para a lista</a></p>
</body>

</html>
