{% extends "base.html" %}

{% block content %}
<div class="pagina-centralizada">
    <h1>Login</h1>

    <div class="card" style="max-width: 420px; width: 100%;">

        {% if form.errors %}
        <div class="alerta">
            Usuário ou senha inválidos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">
                    Usuário
                </label>

                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">
                    Senha
                </label>

                <div class="campo-senha">
                    {{ form.password }}

                    <button type="button"
                            class="toggle-senha"
                            data-alvo="{{ form.password.id_for_label }}">

                        <svg class="icon-eye-open"
                             xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">

                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>

                        </svg>

                        <svg class="icon-eye-closed"
                             xmlns="http://www.w3.org/2000/svg"
                             width="18"
                             height="18"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             style="display:none;">

                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>

                            <line x1="1"
                                  y1="1"
                                  x2="23"
                                  y2="23"></line>

                        </svg>

                    </button>
                </div>
            </div>

            <button type="submit"
                    class="btn btn-primary"
                    style="width: 100%; justify-content: center;">

                Entrar

            </button>

        </form>
    </div>
</div>
{% endblock %}
