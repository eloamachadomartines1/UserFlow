<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Usuários{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6d5efc;
            --primary-dark: #5645e0;
            --primary-light: #efedff;
            --danger: #f2495c;
            --danger-light: #fdeaec;
            --warning: #ffb648;
            --text: #1f2233;
            --text-soft: #6b7086;
            --bg: #f6f6fb;
            --card: #ffffff;
            --border: #ebebf3;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(31, 34, 51, 0.06);
        }

        [data-theme="dark"] {
            --primary: #8b7cff;
            --primary-dark: #a396ff;
            --primary-light: #2a2555;
            --danger: #ff6b7a;
            --danger-light: #3a2228;
            --warning: #ffb648;
            --text: #ececf5;
            --text-soft: #9a9ab0;
            --bg: #14141f;
            --card: #1c1c2b;
            --border: #2b2b3d;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        body {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 24px;
        }

        /* NAVBAR */
        /* NAVBAR */
        nav {
            background-color: var(--primary);
            border-bottom: none;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.1rem;
            color: white;
            letter-spacing: -0.02em;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            list-style: none;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        nav ul li a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
        }

        nav ul li a.destaque {
            background-color: white;
            color: var(--primary-dark);
        }

        nav ul li a.destaque:hover {
            background-color: #f0f0ff;
        }

        .user-chip {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.85);
            /* background-color: rgba(255, 255, 255, 0.1); */
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
        }

        /* LAYOUT */
        main {
            padding: 40px 32px;
            max-width: 960px;
            margin: 0 auto;
        }

        /* CARD */
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--text-soft);
            color: var(--text);
        }

        .btn-danger {
            background-color: var(--danger-light);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-warning {
            background-color: #fff4e2;
            color: #b3730a;
        }

        .btn-warning:hover {
            background-color: var(--warning);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 8px;
        }

        .btn-link {
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .btn-link:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* TABLE */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        thead th {
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-soft);
            font-weight: 600;
            padding: 18px 16px;
        }

        tbody tr {
            background-color: var(--card);
        }

        tbody td {
            padding: 18px 16px;
            border-top: 1px solid var(--border);
            font-size: 0.96rem;
        }

        tbody tr:hover {
            background-color: var(--primary-light);
        }

        /* AVATAR */
        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar-vazio {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        select,
        input[type="file"] {
            width: 100%;
            font-family: inherit;
            font-size: 0.94rem;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: #fcfcfe;
            transition: border-color 0.15s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
        }

        .erro {
            color: var(--danger);
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .topo-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .vazio {
            text-align: center;
            color: var(--text-soft);
            padding: 40px 0;
        }

        .alerta {
            background-color: var(--danger-light);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .aviso-login {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .aviso-login a {
            color: var(--primary-dark);
            font-weight: 600;
        }

        .pagina-centralizada {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 64px - 80px);
        }

        .theme-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease;
        }

        .theme-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>
    <nav>
        <span class="nav-brand">UserFlow</span>
        <ul>
            {% if not user.is_authenticated %}
            <li><a href="{% url 'cadastro' %}">Cadastre-se</a></li>
            <li><a href="{% url 'login' %}" class="destaque">Login</a></li>
            {% endif %}

            <li><a href="{% url 'listar_usuarios' %}">Usuários</a></li>
            <li>
                <button type="button" id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
                    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </li>

            {% if user.is_authenticated %}
            <li class="user-chip">Olá, {{ user.username }}</li>
            <li>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-link">Sair</button>
                </form>
            </li>
            {% endif %}
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const iconMoon = document.getElementById('icon-moon');
        const iconSun = document.getElementById('icon-sun');
        const root = document.documentElement;

        function atualizarIcone(tema) {
            if (tema === 'dark') {
                iconMoon.style.display = 'none';
                iconSun.style.display = 'block';
            } else {
                iconMoon.style.display = 'block';
                iconSun.style.display = 'none';
            }
        }

        const temaSalvo = localStorage.getItem('tema') || 'light';
        if (temaSalvo === 'dark') {
            root.setAttribute('data-theme', 'dark');
        }
        atualizarIcone(temaSalvo);

        themeToggle.addEventListener('click', () => {
            const atual = root.getAttribute('data-theme');
            const novoTema = atual === 'dark' ? 'light' : 'dark';

            if (novoTema === 'dark') {
                root.setAttribute('data-theme', 'dark');
            } else {
                root.removeAttribute('data-theme');
            }

            localStorage.setItem('tema', novoTema);
            atualizarIcone(novoTema);
        });
    </script>

</body>

</html>
