<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Usuários{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6d5efc;
            --primary-dark: #5645e0;
            --primary-light: #efedff;
            --danger: #f2495c;
            --danger-light: #fdeaec;
            --warning: #ffb648;
            --text: #1f2233;
            --text-soft: #6b7086;
            --bg: #f6f6fb;
            --card: #ffffff;
            --border: #ebebf3;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(31, 34, 51, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 24px;
        }

        /* NAVBAR */
        nav {
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: var(--text-soft);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        nav ul li a:hover {
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        nav ul li a.destaque {
            background-color: var(--primary);
            color: white;
        }

        nav ul li a.destaque:hover {
            background-color: var(--primary-dark);
        }

        .user-chip {
            font-size: 0.88rem;
            color: var(--text-soft);
        }

        /* LAYOUT */
        main {
            padding: 40px 32px;
            max-width: 960px;
            margin: 0 auto;
        }

        /* CARD */
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--text-soft);
            color: var(--text);
        }

        .btn-danger {
            background-color: var(--danger-light);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-warning {
            background-color: #fff4e2;
            color: #b3730a;
        }

        .btn-warning:hover {
            background-color: var(--warning);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 8px;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-soft);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0;
        }

        .btn-link:hover {
            color: var(--primary-dark);
        }

        /* TABLE */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        thead th {
            text-align: left;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-soft);
            font-weight: 600;
            padding: 0 16px 12px;
        }

        tbody tr {
            background-color: var(--card);
        }

        tbody td {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            font-size: 0.94rem;
        }

        tbody tr:hover {
            background-color: #fafaff;
        }

        /* AVATAR */
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar-vazio {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        select,
        input[type="file"] {
            width: 100%;
            font-family: inherit;
            font-size: 0.94rem;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background-color: #fcfcfe;
            transition: border-color 0.15s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
        }

        .erro {
            color: var(--danger);
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .topo-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .vazio {
            text-align: center;
            color: var(--text-soft);
            padding: 40px 0;
        }

        .alerta {
            background-color: var(--danger-light);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .aviso-login {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .aviso-login a {
            color: var(--primary-dark);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <nav>
        <span class="nav-brand">usuarios</span>
        <ul>
            {% if not user.is_authenticated %}
            <li><a href="{% url 'cadastro' %}">Cadastre-se</a></li>
            <li><a href="{% url 'login' %}" class="destaque">Login</a></li>
            {% endif %}

            <li><a href="{% url 'listar_usuarios' %}">Usuários</a></li>

            {% if user.is_authenticated %}
            <li class="user-chip">Olá, {{ user.username }}</li>
            <li>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-link">Sair</button>
                </form>
            </li>
            {% endif %}
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
