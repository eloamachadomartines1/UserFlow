<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Usuários{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eaf1fe;
            --danger: #f2495c;
            --danger-light: #fdeaec;
            --warning: #ffb648;
            --text: #1f2233;
            --text-soft: #6b7086;
            --bg: #f6f6fb;
            --card: #ffffff;
            --border: #ebebf3;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(31, 34, 51, 0.06);
            --input-border: #d5d5e0;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --primary: #5b8def;
            --primary-dark: #7ba3f5;
            --primary-light: #1c2b4a;
            --danger: #ff6b7a;
            --danger-light: #3a2228;
            --warning: #ffb648;
            --text: #ececf5;
            --text-soft: #9a9ab0;
            --bg: #14141f;
            --card: #1c1c2b;
            --border: #2b2b3d;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            --input-border: #3a3a52;
        }

        body {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 24px;
        }

        /* NAVBAR */

        nav {
            background-color: var(--primary);
            border-bottom: none;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.1rem;
            color: white;
            letter-spacing: -0.02em;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            list-style: none;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        nav ul li a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
        }

        nav ul li a.destaque {
            background-color: white;
            color: var(--primary-dark);
        }

        nav ul li a.destaque:hover {
            background-color: #f0f0ff;
        }

        .user-chip {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
        }

        /* LAYOUT */

        main {
            padding: 40px 32px;
            max-width: 960px;
            margin: 0 auto;
        }

        /* CARD */

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        /* BUTTONS */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-soft);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--text-soft);
            color: var(--text);
        }

        .btn-danger {
            background-color: var(--danger-light);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-warning {
            background-color: #fff4e2;
            color: #b3730a;
        }

        .btn-warning:hover {
            background-color: var(--warning);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: 8px;
        }

        .btn-link {
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .btn-link:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* TABLE */

        table {
            border-collapse: collapse;
            width: 100%;
        }

        thead th {
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-soft);
            font-weight: 600;
            padding: 18px 16px;
        }

        tbody tr {
            background-color: var(--card);
        }

        tbody td {
            padding: 18px 16px;
            border-top: 1px solid var(--border);
            font-size: 0.96rem;
        }

        tbody tr:hover {
            background-color: var(--primary-light);
        }

        /* AVATAR */

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar-vazio {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: var(--primary-light);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        select,
        input[type="file"] {
            width: 100%;
            font-family: inherit;
            font-size: 0.94rem;
            padding: 10px 14px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--card);
            color: var(--text);
            transition: border-color 0.15s ease;
        }

        input::placeholder {
            color: var(--text-soft);
            opacity: 1;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active,
        select:-webkit-autofill,
        input:autofill {
            -webkit-box-shadow: 0 0 0 1000px var(--card) inset !important;
            box-shadow: 0 0 0 1000px var(--card) inset !important;
            -webkit-text-fill-color: var(--text) !important;
            caret-color: var(--text) !important;
            border: 1px solid var(--border) !important;
            background-color: var(--card) !important;
            color: var(--text) !important;
            transition: background-color 9999s ease-in-out 0s, color 9999s ease-in-out 0s !important;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--card);
        }

        .erro {
            color: var(--danger);
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .topo-acoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .vazio {
            text-align: center;
            color: var(--text-soft);
            padding: 40px 0;
        }

        .alerta {
            background-color: var(--danger-light);
            color: var(--danger);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.88rem;
            margin-bottom: 18px;
        }

        .pagina-centralizada {
            min-height: calc(100vh - 144px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pagina-centralizada h1 {
            text-align: center;
        }

        .campo-senha {
            position: relative;
        }

        .campo-senha input {
            padding-right: 45px;
        }

        .toggle-senha {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--text-soft);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-senha:hover {
            color: var(--text);
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {
            nav {
                padding: 0 16px;
            }

            main {
                padding: 24px 16px;
            }

            .card {
                padding: 20px;
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-brand">UserFlow</div>

        {% if user.is_authenticated %}
        <ul>
            <li>
                <span class="user-chip">Olá, {{ user.username }}</span>
            </li>

            <li>
                <a href="{% url 'listar_usuarios' %}">Usuários</a>
            </li>

            <li>
                <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" class="btn-link">Sair</button>
                </form>
            </li>
        </ul>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        document.querySelectorAll('.toggle-senha').forEach(function (botao) {
            botao.addEventListener('click', function () {
                const campo = document.getElementById(this.dataset.alvo);
                const olhoAberto = this.querySelector('.icon-eye-open');
                const olhoFechado = this.querySelector('.icon-eye-closed');

                if (campo.type === 'password') {
                    campo.type = 'text';
                    olhoAberto.style.display = 'none';
                    olhoFechado.style.display = 'block';
                } else {
                    campo.type = 'password';
                    olhoAberto.style.display = 'block';
                    olhoFechado.style.display = 'none';
                }
            });
        });

        document.querySelectorAll('input[name="cpf"]').forEach(function (input) {
            input.addEventListener('input', function () {
                let numeros = this.value.replace(/\D/g, '');

                if (numeros.length > 11) {
                    numeros = numeros.substring(0, 11);
                }

                let formatado = numeros;

                if (numeros.length > 3) {
                    formatado = numeros.replace(/(\d{3})(\d{1,3})/, '$1.$2');
                }

                if (numeros.length > 6) {
                    formatado = numeros.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
                }

                if (numeros.length > 9) {
                    formatado = numeros.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
                }

                this.value = formatado;
            });
        });
    </script>

</body>

</html>
